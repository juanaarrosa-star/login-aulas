<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FridgeFinder</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Pantalla 1: búsqueda y listado -->
    <div id="busqueda">
        <h1>FridgeFinder</h1>
        <p>¿Qué tenés en la heladera?</p>

        <div id="chips"></div>

        <input id="ingrediente" type="text" placeholder="Ej: chicken, tomato, onion">
        <button id="btnAgregarIngrediente">Agregar</button>
        <p class="ayuda">Escribí el ingrediente en inglés — TheMealDB solo entiende nombres en inglés (ej: chicken, tomato, cheese, onion).</p>

        <button id="btnBuscar">Buscar recetas</button>
        <button id="btnVaciar">Vaciar todo</button>

        <p id="mensaje"></p>

        <h2>Resultados</h2>
        <div id="resultados"></div>
    </div>

    <!-- Pantalla 2: detalle de una receta (oculta hasta que se elige una) -->
    <div id="detalle" style="display: none;">
        <button id="btnVolver">← volver</button>
        <div id="detalleContenido"></div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
